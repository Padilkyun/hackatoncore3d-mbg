{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Meta Bin Go{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans antialiased">
    <div class="min-h-screen bg-gray-100 flex">
        <!-- Sidebar Navigation -->
        <div class="flex flex-col relative h-screen sticky top-0 overflow-y-auto" style="width: 271px; background-image: url('{% static 'image/navbar.png' %}'); background-size: cover; background-position: center;">
            <div class="absolute inset-0 bg-[#062C1B] opacity-10"></div>
            <div class="relative z-10 flex flex-col h-full text-white">
                <div class="p-8 text-center px-4">
                    <h1 class="text-2xl font-bold tracking-tight text-white">
                        Meta Bin Go
                    </h1>
                </div>

                <nav class="flex-1 px-4 space-y-2">
                    <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 p-3 rounded-xl transition group {% if request.resolver_match.url_name == 'dashboard' %}bg-white text-[#062C1B] font-semibold shadow-lg{% else %}text-gray-300 hover:bg-white/10{% endif %}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                        <span>Dashboard</span>
                    </a>

                    <a href="{% url 'bin_monitoring' %}" class="flex items-center space-x-3 p-3 rounded-xl transition group {% if request.resolver_match.url_name == 'bin_monitoring' %}bg-white text-[#062C1B] font-semibold shadow-lg{% else %}text-gray-300 hover:bg-white/10{% endif %}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-7h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        <span>Bin Monitoring</span>
                    </a>

                    <a href="{% url 'route_map' %}" class="flex items-center space-x-3 p-3 rounded-xl transition group {% if request.resolver_match.url_name == 'route_map' %}bg-white text-[#062C1B] font-semibold shadow-lg{% else %}text-gray-300 hover:bg-white/10{% endif %}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        <span>Route Map</span>
                    </a>

                    <a href="{% url 'air_monitoring' %}" class="flex items-center space-x-3 p-3 rounded-xl transition group {% if request.resolver_match.url_name == 'air_monitoring' %}bg-white text-[#062C1B] font-semibold shadow-lg{% else %}text-gray-300 hover:bg-white/10{% endif %}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                        <span>Air Monitoring</span>
                    </a>

                    <a href="{% url 'reward_management' %}" class="flex items-center space-x-3 p-3 rounded-xl transition group {% if request.resolver_match.url_name == 'reward_management' %}bg-white text-[#062C1B] font-semibold shadow-lg{% else %}text-gray-300 hover:bg-white/10{% endif %}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                        <span>Reward Management</span>
                    </a>
                </nav>

                <div class="p-4 border-t border-white/10">
                    <form method="POST" action="{% url 'admin:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="w-full flex items-center space-x-3 p-3 hover:bg-red-600/80 rounded-xl transition group">
                            <svg class="w-6 h-6 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            <span>Log Out</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
